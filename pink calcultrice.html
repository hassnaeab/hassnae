<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Calculatrice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
            background-color: #f887d0; 
        }
        h2 {
            color: #872966;
        }
        input {
            width: 200px;
            height: 40px;
            font-size: 20px;
            text-align: right;
            margin-bottom: 10px;
            border: 2px solid #a3d7f9;
            border-radius: 5px;
            background-color: #89d2f9; 
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            width: 50px;
            height: 50px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        button:nth-child(-n+10):not(:nth-child(4n)) {
            background-color: #fb54be; 
            color: rgb(252, 144, 248);
        }
        button:nth-child(-n+10):not(:nth-child(4n)):hover {
            background-color: #f929a9;
        }
        
        button:nth-child(4n) {
            background-color: #ff24d0; 
            color: rgb(248, 120, 207);
        }
        button:nth-child(4n):hover {
            background-color: #f51ddc;
        }
        
        button:nth-child(14) {
            background-color: #f828b9; 
            color: rgb(235, 125, 200);
        }
        button:nth-child(14):hover {
            background-color: #ff3ae5;
        }
        
        button:nth-child(15) {
            background-color: #f934db; 
            color: rgb(253, 156, 237);
        }
        button:nth-child(15):hover {
            background-color: #ff24d0;
        }
    </style>
</head>
<body>
    <h2>Calculatrice</h2>
    <input type="text" id="display" placeholder="0" disabled>
    <div class="buttons">
        <button onclick="appendToDisplay('7')">7</button>
        <button onclick="appendToDisplay('8')">8</button>
        <button onclick="appendToDisplay('9')">9</button>
        <button onclick="appendToDisplay('/')">/</button>
        <button onclick="appendToDisplay('4')">4</button>
        <button onclick="appendToDisplay('5')">5</button>
        <button onclick="appendToDisplay('6')">6</button>
        <button onclick="appendToDisplay('*')">*</button>
        <button onclick="appendToDisplay('1')">1</button>
        <button onclick="appendToDisplay('2')">2</button>
        <button onclick="appendToDisplay('3')">3</button>
        <button onclick="appendToDisplay('-')">-</button>
        <button onclick="appendToDisplay('0')">0</button>
        <button onclick="calculate()">=</button>
        <button onclick="clearDisplay()">C</button>
        <button onclick="appendToDisplay('+')">+</button>
    </div>

    <script>
        let display = document.getElementById('display');
        let currentInput = '';

        function appendToDisplay(value) {
            currentInput += value;
            display.value = currentInput;
        }

        function clearDisplay() {
            currentInput = '';
            display.value = '';
        }

        function calculate() {
            try {
                currentInput = eval(currentInput).toString();
                display.value = currentInput;
            } catch (error) {
                display.value = 'Erreur';
                currentInput = '';
            }
        }
    </script>
</body>
</html>
